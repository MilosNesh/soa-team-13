version: "3.7"

services:
  gateway:
    build: 
      context: ./gateway
      dockerfile: Dockerfile
    image: gateway
    container_name: gateway_service
    restart: always
    networks:
      - servers
    ports:
      - 8070:8070
  stakeholders:
    build:
      context: ./stakeholders
      dockerfile: Dockerfile
    image: stakeholders
    container_name: stakeholders_service
    restart: always
    networks:
      - servers
    ports:
      - 8080:8080
    depends_on:
      - database

  database:
    image: postgres
    container_name: stakeholders_postgres
    restart: always
    networks:
      - servers
    ports:
      - 5000:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super
      POSTGRES_DB: stakeholders
    volumes:
      - postgres-data:/var/lib/postgresql/data

  blog:
    build:
      context: ./blog
      dockerfile: Dockerfile
    image: blog
    container_name: blog_service
    restart: always
    networks:
      - servers
    ports:
      - 8081:8081
    depends_on:
      - mongo_db

  mongo_db:
    image: mongo
    container_name: blog_mongo
    restart: always
    networks:
      - servers
    ports:
      - 27018:27017
    volumes:
      - mongo-data:/data/db

  followers:
    build:
      context: ./followers
      dockerfile: Dockerfile
    image: followers
    container_name: followers_service
    restart: always
    networks:
      - servers
    ports:
      - 8082:8082
    depends_on:
      - neo4j


  neo4j:
    image: neo4j:5.20
    container_name: follower_neo4j
    restart: always
    networks:
      - servers
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/plugins:/plugins


volumes:
  postgres-data:
  mongo-data:

networks:
  servers:
    driver: bridge



