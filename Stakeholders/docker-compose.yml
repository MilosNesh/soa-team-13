version: "3.7"
services:
  servers:
    build:
      context: ./
      dockerfile: Dockerfile
    image: stakeholders
    container_name: stakeholders_sevice
    restart: always
    networks:
      - servers
    ports:
      - 8080:8080
    depends_on:
      - database
  
  database:
    image: postgres
    container_name: postgres
    restart: always
    networks:
      - servers
    ports:
      - 5000:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super
      POSTGRES_DB: stakeholders
    volumes:
      - database-data:/var/lib/postgressql/data

volumes:
  database-data:
    name: server-database

networks:
  servers:
    name: servers
    driver: bridge
