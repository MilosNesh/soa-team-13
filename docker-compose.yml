version: "3.7"

services:
  gateway:
    build: 
      context: ./gateway
      dockerfile: Dockerfile
    image: gateway
    container_name: gateway_service
    restart: always
    networks:
      - servers
    ports:
      - 8070:8070
      - 8071:8071
    depends_on:
      - stakeholders
  stakeholders:
    build:
      context: ./stakeholders
      dockerfile: Dockerfile
    image: stakeholders
    container_name: stakeholders_service
    restart: always
    networks:
      - servers
    ports:
      - 8080:8080
      - 50051:50051 
    depends_on:
      - database

  database:
    image: postgres
    container_name: stakeholders_postgres
    restart: always
    networks:
      - servers
    ports:
      - 5000:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super
      POSTGRES_DB: stakeholders
    volumes:
      - postgres-data:/var/lib/postgresql/data

  blog:
    build:
      context: ./blog
      dockerfile: Dockerfile
    image: blog
    container_name: blog_service
    restart: always
    networks:
      - servers
    ports:
      - 8081:8081
    depends_on:
      - mongo_db

  mongo_db:
    image: mongo
    container_name: blog_mongo
    restart: always
    networks:
      - servers
    ports:
      - 27018:27017
    volumes:
      - mongo-data:/data/db

  tours:
    build:
      context: ./tours
      dockerfile: Dockerfile
    container_name: tours_service
    ports:
      - "8084:8084"  
    depends_on:
     - tour_database
    networks:
      - servers

  tour_database:
    image: postgres
    container_name: tour_postgres
    restart: always
    networks:
      - servers
    ports:
      - 5001:5432
    environment:
      POSTGRES_USER: postgres_tour
      POSTGRES_PASSWORD: super_tour
      POSTGRES_DB: toursdb
    volumes:
      - postgres-data-tours:/var/lib/postgresql/data
      
  shopping:
    build:
      context: ./shopping
      dockerfile: Dockerfile
    image: shopping
    container_name: shopping_service
    restart: always
    networks:
      - servers
    ports:
      - 8082:8082
    depends_on:
      - shopping_database

  shopping_database:
    image: postgres
    container_name: shopping_postgres
    restart: always
    networks:
      - servers
    ports:
      - 5002:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super
      POSTGRES_DB: shopping
    volumes:
      - postgres-data-shopping:/var/lib/postgresql/data

volumes:
  postgres-data:
  postgres-data-tours:
  mongo-data:
  postgres-data-shopping:

networks:
  servers:
    driver: bridge
